<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routeur Voile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Libre+Caslon+Text:ital@1&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<!-- The chart is the page: every panel floats over it. -->
<div id="map" class="map" data-i18n-attr="aria-label:map.title" role="region"></div>

<nav class="rail" data-i18n-attr="aria-label:rail.label">
  <svg class="rail-logo" viewBox="-50 -50 100 100" aria-hidden="true">
    <circle r="46" class="rose-ring"/>
    <path class="rose-point" d="M0 -46 L8 -8 L0 0 Z M0 46 L-8 8 L0 0 Z M46 0 L8 8 L0 0 Z M-46 0 L-8 -8 L0 0 Z"/>
    <path class="rose-point light" d="M0 -46 L-8 -8 L0 0 Z M0 46 L8 8 L0 0 Z M46 0 L8 -8 L0 0 Z M-46 0 L-8 8 L0 0 Z"/>
  </svg>
  <div class="rail-group">
    <button type="button" class="rail-button" data-panel="route-form" data-i18n-attr="aria-label:rail.route;title:rail.route">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>
    </button>
    <button type="button" class="rail-button" data-panel="plan" data-i18n-attr="aria-label:rail.plan;title:rail.plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
    </button>
    <button type="button" class="rail-button" data-panel="dock" data-i18n-attr="aria-label:rail.options;title:rail.options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V12M12 12 5 4M12 12l7-8M5 4v4M5 4h4M19 4v4M19 4h-4"/></svg>
    </button>
  </div>
  <div class="rail-group rail-bottom">
    <button type="button" id="settings-open" class="rail-button" data-i18n-attr="aria-label:settings.title;title:settings.title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
    <div id="lang-picker" class="lang-picker" role="group" data-i18n-attr="aria-label:lang.label"></div>
  </div>
</nav>

<main class="overlay">
  <form id="route-form" class="glass panel form-panel" novalidate>
    <p class="greeting" data-i18n="form.greeting"></p>
    <h1 class="race-title" data-i18n="race.route-du-rhum-2026"></h1>
    <p class="tagline" data-i18n="app.tagline"></p>
    <div class="form-row">
      <label class="field">
        <span class="field-label" data-i18n="form.race"></span>
        <select id="race"></select>
      </label>
      <label class="field">
        <span class="field-label" data-i18n="form.boat"></span>
        <select id="boat"></select>
      </label>
    </div>
    <label class="field">
      <span class="field-label" data-i18n="form.position"></span>
      <input id="position" type="text" inputmode="text" autocomplete="off" spellcheck="false"
             aria-describedby="position-feedback" data-i18n-attr="placeholder:form.position_placeholder">
    </label>
    <p id="position-feedback" class="position-feedback" aria-live="polite"></p>
    <button id="submit" class="submit" type="submit"></button>
  </form>

  <div class="tools">
    <div id="map-controls" class="glass map-controls"></div>
    <details class="glass legend-panel">
      <summary data-i18n="map.legend_title"></summary>
      <ul class="map-legend">
        <li><span class="legend-ideal"></span><span data-i18n="map.legend_ideal"></span></li>
        <li><span class="legend-line thick"></span><span data-i18n="map.legend_option"></span></li>
        <li><span class="legend-line thin"></span><span data-i18n="map.legend_members"></span></li>
        <li><span class="legend-zone"></span><span data-i18n="map.legend_zones"></span></li>
        <li><span class="legend-restricted"></span><span data-i18n="map.legend_course"></span></li>
      </ul>
      <p id="wind-source" class="fine-print"></p>
      <p id="weather-status" class="fine-print"></p>
      <p class="fine-print mock-note" data-i18n="mock.banner"></p>
      <p class="fine-print" data-i18n="disclaimer"></p>
      <p class="fine-print" data-i18n="credits"></p>
    </details>
    <section id="plan" class="glass panel plan-panel"></section>
  </div>

  <div id="dock" class="dock">
    <section id="now-panel" class="glass panel now-panel" aria-live="polite"></section>
    <section id="options" class="options"></section>
  </div>
</main>

<dialog id="settings" class="glass settings">
  <form method="dialog" class="settings-head">
    <h2 class="panel-title" data-i18n="settings.title"></h2>
    <button class="close-button" data-i18n-attr="aria-label:settings.close">×</button>
  </form>
  <div class="settings-body">
    <fieldset>
      <legend data-i18n="settings.boat_options"></legend>
      <label class="check"><input id="opt-foils" type="checkbox" checked><span data-i18n="settings.foils"></span></label>
      <label class="check"><input id="opt-heavy" type="checkbox" checked><span data-i18n="settings.heavy"></span></label>
      <label class="check"><input id="opt-light" type="checkbox" checked><span data-i18n="settings.light"></span></label>
      <label class="check"><input id="opt-reach" type="checkbox" checked><span data-i18n="settings.reach"></span></label>
      <label class="check"><input id="opt-winch" type="checkbox" checked><span data-i18n="settings.winch"></span></label>
      <label class="check"><input id="opt-hull" type="checkbox" checked><span data-i18n="settings.hull"></span></label>
    </fieldset>
    <fieldset>
      <legend data-i18n="settings.penalties"></legend>
      <div class="penalties">
        <label class="field"><span class="field-label" data-i18n="settings.tack"></span><input id="pen-tack" type="number" min="0" step="0.5" value="3"></label>
        <label class="field"><span class="field-label" data-i18n="settings.gybe"></span><input id="pen-gybe" type="number" min="0" step="0.5" value="3"></label>
        <label class="field"><span class="field-label" data-i18n="settings.sail_change"></span><input id="pen-sail" type="number" min="0" step="0.5" value="4"></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="settings.polar"></legend>
      <p class="fine-print" data-i18n="settings.polar_current"></p>
      <label class="field">
        <span class="field-label" data-i18n="settings.polar_import"></span>
        <input id="polar-file" type="file" accept="application/json,.json">
      </label>
    </fieldset>
  </div>
</dialog>
</body>
</html>
