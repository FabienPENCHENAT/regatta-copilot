<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routeur Voile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<!-- The chart is the page: every panel floats over it. -->
<div id="map" class="map" data-i18n-attr="aria-label:map.title" role="region"></div>

<nav class="rail" data-i18n-attr="aria-label:rail.label">
  <!-- Logo: mainsail and jib cut into facets, like a gem. -->
  <svg class="rail-logo" viewBox="0 0 40 40" aria-hidden="true">
    <path class="facet main-a" d="M19 3 L19 33 L26 21 Z"/>
    <path class="facet main-b" d="M19 3 L26 21 L34 33 Z"/>
    <path class="facet main-c" d="M19 33 L26 21 L34 33 Z"/>
    <path class="facet jib-a" d="M16 9 L16 33 L11 25 Z"/>
    <path class="facet jib-b" d="M16 9 L11 25 L5 33 Z"/>
    <path class="facet jib-c" d="M16 33 L11 25 L5 33 Z"/>
  </svg>
  <div class="rail-group rail-bottom">
    <button type="button" id="theme-toggle" class="rail-button">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" id="settings-open" class="rail-button" data-i18n-attr="aria-label:settings.title;title:settings.title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
    <a href="how.html" class="rail-button" data-i18n-attr="aria-label:how.link;title:how.link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r="0.6"/></svg>
    </a>
    <div id="lang-picker" class="lang-picker" role="group" data-i18n-attr="aria-label:lang.label"></div>
  </div>
</nav>

<main class="overlay">
  <form id="route-form" class="glass panel form-panel" novalidate>
    <h1 class="race-title">
      <label class="race-picker">
        <span class="visually-hidden" data-i18n="form.race"></span>
        <select id="race" class="race-select"></select>
      </label>
    </h1>
    <div id="race-header" class="race-header"></div>
    <div class="form-summary">
      <span id="form-summary-text" class="form-summary-text"></span>
      <button type="button" id="form-edit" class="text-button" data-i18n="form.edit"></button>
    </div>
    <div class="form-body">
      <fieldset class="field boat-field">
        <legend class="field-label" data-i18n="form.boat"></legend>
        <div id="boat-picker" class="boat-picker"></div>
      </fieldset>
      <label class="field">
        <span class="field-label" data-i18n="form.position"></span>
        <span class="position-input">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
          <input id="position" type="text" inputmode="text" autocomplete="off" spellcheck="false"
                 aria-describedby="position-feedback" data-i18n-attr="placeholder:form.position_placeholder">
        </span>
      </label>
      <p id="position-feedback" class="position-feedback" aria-live="polite"></p>
      <button id="submit" class="submit" type="submit">
        <span class="submit-label"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </form>

  <div id="tools" class="tools">
    <button type="button" id="tools-toggle" class="collapse-toggle side">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div id="map-controls" class="glass map-controls"></div>
    <div class="glass legend-panel">
      <p class="refresh-line">
        <span class="refresh-dot" aria-hidden="true"></span>
        <span id="refresh-text"></span>
      </p>
      <details>
        <summary data-i18n="map.legend_title"></summary>
        <ul class="map-legend">
          <li><span class="legend-ideal"></span><span data-i18n="map.legend_ideal"></span></li>
          <li><span class="legend-line thick"></span><span data-i18n="map.legend_option"></span></li>
          <li><span class="legend-line thin"></span><span data-i18n="map.legend_members"></span></li>
          <li><span class="legend-zone"></span><span data-i18n="map.legend_zones"></span></li>
          <li><span class="legend-restricted"></span><span data-i18n="map.legend_course"></span></li>
        </ul>
      </details>
    </div>
    <section id="plan" class="glass panel plan-panel"></section>
  </div>

  <div id="dock" class="dock">
    <button type="button" id="dock-toggle" class="collapse-toggle bottom">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <section id="now-panel" class="glass panel now-panel" aria-live="polite"></section>
    <section id="options" class="options"></section>
  </div>
</main>

<dialog id="settings" class="glass settings">
  <form method="dialog" class="settings-head">
    <h2 class="panel-title" data-i18n="settings.title"></h2>
    <button class="close-button" data-i18n-attr="aria-label:settings.close">×</button>
  </form>
  <div class="settings-body">
    <fieldset class="settings-section">
      <legend data-i18n="settings.boat_options"></legend>
      <div class="check-grid">
        <label class="check"><input id="opt-foils" type="checkbox" checked><span data-i18n="settings.foils"></span></label>
        <label class="check"><input id="opt-heavy" type="checkbox" checked><span data-i18n="settings.heavy"></span></label>
        <label class="check"><input id="opt-light" type="checkbox" checked><span data-i18n="settings.light"></span></label>
        <label class="check"><input id="opt-reach" type="checkbox" checked><span data-i18n="settings.reach"></span></label>
        <label class="check"><input id="opt-winch" type="checkbox" checked><span data-i18n="settings.winch"></span></label>
        <label class="check"><input id="opt-hull" type="checkbox" checked><span data-i18n="settings.hull"></span></label>
      </div>
    </fieldset>
    <fieldset class="settings-section">
      <legend data-i18n="settings.penalties"></legend>
      <label class="penalty-row"><span data-i18n="settings.tack"></span><span class="penalty-input"><input id="pen-tack" type="number" min="0" step="0.5" value="3"><span data-i18n="settings.minutes"></span></span></label>
      <label class="penalty-row"><span data-i18n="settings.gybe"></span><span class="penalty-input"><input id="pen-gybe" type="number" min="0" step="0.5" value="3"><span data-i18n="settings.minutes"></span></span></label>
      <label class="penalty-row"><span data-i18n="settings.sail_change"></span><span class="penalty-input"><input id="pen-sail" type="number" min="0" step="0.5" value="4"><span data-i18n="settings.minutes"></span></span></label>
    </fieldset>
    <fieldset class="settings-section">
      <legend data-i18n="settings.polar"></legend>
      <p class="fine-print" data-i18n="settings.polar_current"></p>
      <label class="file-button">
        <input id="polar-file" type="file" accept="application/json,.json">
        <span data-i18n="settings.polar_import"></span>
      </label>
    </fieldset>
  </div>
</dialog>
</body>
</html>
