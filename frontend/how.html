<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routeur Voile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/how.css">
<script type="module" src="src/how-main.js"></script>
</head>
<body class="how-body">
<header class="how-bar">
  <a class="how-back" href="index.html">
    <svg class="rail-logo" viewBox="0 0 40 40" aria-hidden="true">
      <path class="facet main-a" d="M19 3 L19 33 L26 21 Z"/>
      <path class="facet main-b" d="M19 3 L26 21 L34 33 Z"/>
      <path class="facet main-c" d="M19 33 L26 21 L34 33 Z"/>
      <path class="facet jib-a" d="M16 9 L16 33 L11 25 Z"/>
      <path class="facet jib-b" d="M16 9 L11 25 L5 33 Z"/>
      <path class="facet jib-c" d="M16 33 L11 25 L5 33 Z"/>
    </svg>
    <span data-i18n="how.back"></span>
  </a>
  <nav class="how-nav" data-i18n-attr="aria-label:how.nav">
    <a href="#flow" data-i18n="how.flow.title"></a>
    <a href="#data" data-i18n="how.data.title"></a>
    <a href="#refresh" data-i18n="how.fresh.title"></a>
    <a href="#method" data-i18n="how.route.title"></a>
    <a href="#options" data-i18n="how.options.title"></a>
  </nav>
  <div id="lang-picker" class="lang-picker how-lang" role="group" data-i18n-attr="aria-label:lang.label"></div>
</header>

<main class="how-page">
  <!-- Summary and three key figures -->
  <section class="how-hero">
    <h1 class="how-title" data-i18n="how.title"></h1>
    <p class="how-lead" data-i18n="how.lead"></p>
    <ul class="how-stats">
      <li><strong>31</strong><span data-i18n="how.stat.scenarios"></span></li>
      <li><strong>6 h</strong><span data-i18n="how.stat.refresh"></span></li>
      <li><strong>15 min</strong><span data-i18n="how.stat.step"></span></li>
    </ul>
  </section>

  <!-- In short: from the position to the advice -->
  <section id="flow" class="how-section">
    <h2 class="how-h2" data-i18n="how.flow.title"></h2>
    <ol class="how-flow">
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>
        <h3 data-i18n="how.flow.1.title"></h3><p data-i18n="how.flow.1.text"></p>
      </li>
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/></svg>
        <h3 data-i18n="how.flow.2.title"></h3><p data-i18n="how.flow.2.text"></p>
      </li>
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c3-8 7-12 16-13M4 18c4-4 9-6 16-5M4 18c5-1 10 0 16 3"/></svg>
        <h3 data-i18n="how.flow.3.title"></h3><p data-i18n="how.flow.3.text"></p>
      </li>
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
        <h3 data-i18n="how.flow.4.title"></h3><p data-i18n="how.flow.4.text"></p>
      </li>
    </ol>
  </section>

  <!-- Data sources -->
  <section id="data" class="how-section">
    <h2 class="how-h2" data-i18n="how.data.title"></h2>
    <div class="how-cards">
      <article class="how-card accent-blue">
        <span class="how-tag">NOAA GFS</span>
        <h3 data-i18n="how.data.gfs.title"></h3><p data-i18n="how.data.gfs.text"></p>
      </article>
      <article class="how-card accent-mint">
        <span class="how-tag">NOAA GEFS</span>
        <h3 data-i18n="how.data.gefs.title"></h3><p data-i18n="how.data.gefs.text"></p>
      </article>
      <article class="how-card accent-violet">
        <span class="how-tag" data-i18n="how.data.polar.tag"></span>
        <h3 data-i18n="how.data.polar.title"></h3><p data-i18n="how.data.polar.text"></p>
      </article>
      <article class="how-card accent-blue">
        <span class="how-tag" data-i18n="how.data.course.tag"></span>
        <h3 data-i18n="how.data.course.title"></h3><p data-i18n="how.data.course.text"></p>
      </article>
      <article class="how-card accent-mint">
        <span class="how-tag">Natural Earth</span>
        <h3 data-i18n="how.data.geo.title"></h3><p data-i18n="how.data.geo.text"></p>
      </article>
    </div>
  </section>

  <!-- Weather refresh timeline -->
  <section id="refresh" class="how-section">
    <h2 class="how-h2" data-i18n="how.fresh.title"></h2>
    <p class="how-text" data-i18n="how.fresh.lead"></p>
    <ol id="run-timeline" class="how-timeline"></ol>
    <div class="how-callouts">
      <p class="how-callout" data-i18n="how.fresh.background"></p>
      <p class="how-callout" data-i18n="how.fresh.kept"></p>
    </div>
  </section>

  <!-- Isochrone method -->
  <section id="method" class="how-section">
    <h2 class="how-h2" data-i18n="how.route.title"></h2>
    <div class="how-method">
      <svg class="how-figure" viewBox="0 0 640 200" aria-hidden="true">
        <path class="iso" d="M60 100 m-30 0 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0"/>
        <path class="iso" d="M40 100 C40 40 140 30 170 70 C190 100 180 150 140 165 C90 180 40 150 40 100Z"/>
        <path class="iso" d="M30 100 C30 20 220 10 270 70 C300 110 270 175 200 185 C110 195 30 170 30 100Z"/>
        <path class="iso" d="M22 100 C22 5 320 0 380 70 C420 120 370 190 270 196 C150 200 22 180 22 100Z"/>
        <path class="route" d="M60 100 C130 90 200 80 270 72 C330 66 400 72 470 82 C520 90 560 96 590 100"/>
        <circle class="boat" cx="60" cy="100" r="7"/>
        <circle class="mark" cx="590" cy="100" r="9"/>
      </svg>
      <p class="how-caption" data-i18n="how.route.caption"></p>
      <ol class="how-steps">
        <li><h3 data-i18n="how.route.1.title"></h3><p data-i18n="how.route.1.text"></p></li>
        <li><h3 data-i18n="how.route.2.title"></h3><p data-i18n="how.route.2.text"></p></li>
        <li><h3 data-i18n="how.route.3.title"></h3><p data-i18n="how.route.3.text"></p></li>
        <li><h3 data-i18n="how.route.4.title"></h3><p data-i18n="how.route.4.text"></p></li>
      </ol>
    </div>
  </section>

  <!-- From scenarios to options, with an example -->
  <section id="options" class="how-section">
    <h2 class="how-h2" data-i18n="how.options.title"></h2>
    <p class="how-text" data-i18n="how.options.lead"></p>
    <div class="how-example" aria-hidden="true">
      <div class="how-ring" style="--share: 52; --route: var(--route-1)"><span>52%</span><small data-i18n="option.name.west"></small></div>
      <div class="how-ring" style="--share: 26; --route: var(--route-2)"><span>26%</span><small data-i18n="option.name.direct"></small></div>
      <div class="how-ring" style="--share: 22; --route: var(--route-3)"><span>22%</span><small data-i18n="option.name.south"></small></div>
    </div>
    <dl class="how-terms">
      <div><dt data-i18n="how.options.probability.title"></dt><dd data-i18n="how.options.probability.text"></dd></div>
      <div><dt data-i18n="how.options.recommended.title"></dt><dd data-i18n="how.options.recommended.text"></dd></div>
      <div><dt data-i18n="how.options.game.title"></dt><dd data-i18n="how.options.game.text"></dd></div>
      <div><dt data-i18n="how.options.plan.title"></dt><dd data-i18n="how.options.plan.text"></dd></div>
    </dl>
  </section>

  <!-- Settings and limits -->
  <section class="how-section how-two">
    <div>
      <h2 class="how-h2" data-i18n="how.settings.title"></h2>
      <ul class="how-list">
        <li data-i18n="how.settings.sails"></li>
        <li data-i18n="how.settings.maneuvers"></li>
        <li data-i18n="how.settings.polar"></li>
        <li data-i18n="how.settings.marks"></li>
      </ul>
    </div>
    <div>
      <h2 class="how-h2" data-i18n="how.limits.title"></h2>
      <ul class="how-list how-limits">
        <li data-i18n="how.limits.advice"></li>
        <li data-i18n="how.limits.horizon"></li>
        <li data-i18n="how.limits.game"></li>
        <li data-i18n="how.limits.polar"></li>
      </ul>
    </div>
  </section>

  <p class="how-sources" data-i18n="how.sources"></p>
</main>
</body>
</html>
