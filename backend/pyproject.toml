[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sailrouter"
version = "0.1.0"
description = "Routing advisor for Virtual Regatta Offshore (GFS/GEFS isochrone router)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["sailrouter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
